name: Construir y subir la imagen a DockerHub

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Revisión del código
        uses: actions/checkout@v3

      - name: Inicio de sesión en DockerHub con los secretos
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Se construye la imagen y se sube a DockerHub
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: fjmurort/cliniko:latest