version: "3.8"

services:
  web:
    build: .
    ports:
      - "8080:80"
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_NAME=cliniko
      - DB_USER=root
      - DB_PASS=rootpassword
  
  db:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=cliniko
    volumes:
      - ./cliniko.sql:/docker-entrypoint-initdb.d/cliniko.sql